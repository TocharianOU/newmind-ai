services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: newmindhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newmindhub_auth}
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newmindhub-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newmindhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-newmindhub_auth}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DIVE_OVERRIDE_SYSTEM_PROMPT: ${DIVE_OVERRIDE_SYSTEM_PROMPT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:5173}
      CUSTOM_LMSTUDIO_URL: ${CUSTOM_LMSTUDIO_URL:-}
      INVITE_CODES: ${INVITE_CODES:-}
      # Stripe Configuration
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      STRIPE_SETTLEMENT_CURRENCY: ${STRIPE_SETTLEMENT_CURRENCY:-eur}
      # Frontend URL for Stripe redirects
      HUB_FRONTEND_URL: ${HUB_FRONTEND_URL:-http://localhost:23001}
      # Download URLs (optional)
      DOWNLOAD_URL_WINDOWS_X64: ${DOWNLOAD_URL_WINDOWS_X64:-}
      DOWNLOAD_URL_MACOS_INTEL: ${DOWNLOAD_URL_MACOS_INTEL:-}
      DOWNLOAD_URL_MACOS_APPLE_SILICON: ${DOWNLOAD_URL_MACOS_APPLE_SILICON:-}
      DOWNLOAD_URL_LINUX_X64: ${DOWNLOAD_URL_LINUX_X64:-}
      DOWNLOAD_URL_LINUX_ARM64: ${DOWNLOAD_URL_LINUX_ARM64:-}
    ports:
      - "${BACKEND_PORT:-23000}:3000"
    volumes:
      - ./logs:/app/logs
      - ./system-prompt.txt:/app/system-prompt.txt:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - newmindhub-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:23000}
        VITE_DOCS_URL: ${DOCS_URL:-http://localhost:23002}
    container_name: newmindhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-23001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - newmindhub-network

  # Documentation (可选，如果没有 docs 目录可注释掉)
  # docs:
  #   build:
  #     context: ../newmindchat-docs
  #     dockerfile: Dockerfile
  #   container_name: newmindhub-docs
  #   restart: unless-stopped
  #   ports:
  #     - "${DOCS_PORT:-23002}:8002"
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8002/"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3
  #     start_period: 5s
  #   networks:
  #     - newmindhub-network

volumes:
  postgres_data:
    driver: local

networks:
  newmindhub-network:
    driver: bridge
