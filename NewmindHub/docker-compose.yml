version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: newmindhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newmindhub_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - newmindhub-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newmindhub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-newmindhub_auth}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DIVE_OVERRIDE_SYSTEM_PROMPT: ${DIVE_OVERRIDE_SYSTEM_PROMPT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:5173}
      CUSTOM_LMSTUDIO_URL: ${CUSTOM_LMSTUDIO_URL:-}
      INVITE_CODES: ${INVITE_CODES:-}
      DOWNLOAD_URL_WINDOWS_X64: ${DOWNLOAD_URL_WINDOWS_X64:-}
      DOWNLOAD_URL_MACOS_INTEL: ${DOWNLOAD_URL_MACOS_INTEL:-}
      DOWNLOAD_URL_MACOS_APPLE_SILICON: ${DOWNLOAD_URL_MACOS_APPLE_SILICON:-}
      DOWNLOAD_URL_LINUX_X64: ${DOWNLOAD_URL_LINUX_X64:-}
      DOWNLOAD_URL_LINUX_ARM64: ${DOWNLOAD_URL_LINUX_ARM64:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - newmindhub-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-3000}
    container_name: newmindhub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - newmindhub-network

volumes:
  postgres_data:
    driver: local

networks:
  newmindhub-network:
    driver: bridge
