services:
  docs:
    image: python:3.11-slim
    working_dir: /docs
    volumes:
      - ./:/docs
      # 排除本地虚拟环境，避免宿主机的 .venv 干扰容器
      - /docs/.venv
    ports:
      - "23002:8002"
    command: >
      sh -c "pip install uv && uv pip install --system -r requirements.txt && mkdocs serve -a 0.0.0.0:8002"
    environment:
      - PYTHONUNBUFFERED=1
