# NewMind AI — docker-compose
#
# Required variables (set in .env or environment before running):
#   POSTGRES_PASSWORD   — PostgreSQL superuser password
#   JWT_SECRET          — signing key for user tokens
#   ATTACKTRACE_AUTH_TOKEN — shared secret between Hub and MCP Host
#
# Everything else uses sensible defaults.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       attacktrace
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-host:
    build:
      context: ../mcp-host
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ATTACKTRACE_AUTH_TOKEN: ${ATTACKTRACE_AUTH_TOKEN}
      HUB_INTERNAL_URL: http://hub:3000
      HUB_EXTERNAL_PORT: ${PORT:-23000}
    volumes:
      - mcp_data:/app/data

  hub:
    build:
      context: ..
      dockerfile: AttackTraceHub/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-23000}:3000"
    environment:
      DATABASE_URL:            postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/attacktrace
      JWT_SECRET:              ${JWT_SECRET}
      MCP_HOST_URL:            http://mcp-host:61990
      MCP_HOST_INTERNAL_TOKEN: ${ATTACKTRACE_AUTH_TOKEN}
      NODE_ENV:                production

      # Admin (auto-created on first boot)
      ADMIN_EMAIL:             ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD:          ${ADMIN_PASSWORD:-}

      # Networking / security
      FORCE_HTTPS:             ${FORCE_HTTPS:-false}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS:-}
      HUB_FRONTEND_URL:        ${HUB_FRONTEND_URL:-}

      # Feature flags
      DEPLOYMENT_MODE:         ${DEPLOYMENT_MODE:-enterprise}
      SSO_ENABLED:             ${SSO_ENABLED:-false}
      BILLING_ENABLED:         ${BILLING_ENABLED:-false}
      INVITE_CODE_ENABLED:     ${INVITE_CODE_ENABLED:-false}
      LICENSE_ENABLED:         ${LICENSE_ENABLED:-false}

      # SSO providers (only needed when SSO_ENABLED=true)
      SSO_CALLBACK_BASE_URL:   ${SSO_CALLBACK_BASE_URL:-}
      SSO_GOOGLE_CLIENT_ID:    ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET:-}
      SSO_AZURE_ENABLED:       ${SSO_AZURE_ENABLED:-false}
      SSO_AZURE_TENANT_ID:     ${SSO_AZURE_TENANT_ID:-}
      SSO_AZURE_CLIENT_ID:     ${SSO_AZURE_CLIENT_ID:-}
      SSO_AZURE_CLIENT_SECRET: ${SSO_AZURE_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-host:
        condition: service_started

volumes:
  postgres_data:
  mcp_data:
