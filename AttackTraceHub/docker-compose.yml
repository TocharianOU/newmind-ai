# NewMind AI — docker-compose
#
# Required variables (set in .env or environment before running):
#   POSTGRES_PASSWORD   — PostgreSQL superuser password
#   JWT_SECRET          — signing key for user tokens
#   ATTACKTRACE_AUTH_TOKEN — shared secret between Hub and MCP Host
#
# Everything else uses sensible defaults.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       attacktrace
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-host:
    build:
      context: ../mcp-host
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ATTACKTRACE_AUTH_TOKEN: ${ATTACKTRACE_AUTH_TOKEN}
    volumes:
      - mcp_data:/app/data

  hub:
    build:
      context: ..
      dockerfile: AttackTraceHub/Dockerfile
    restart: unless-stopped
    ports:
      - "23000:3000"
    environment:
      DATABASE_URL:            postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/attacktrace
      JWT_SECRET:              ${JWT_SECRET}
      MCP_HOST_URL:            http://mcp-host:61990
      MCP_HOST_INTERNAL_TOKEN: ${ATTACKTRACE_AUTH_TOKEN}
      NODE_ENV:                production
      FORCE_HTTPS:             ${FORCE_HTTPS:-false}
      ALLOWED_ORIGINS:         ${ALLOWED_ORIGINS:-}
      HUB_FRONTEND_URL:        ${HUB_FRONTEND_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      mcp-host:
        condition: service_started

volumes:
  postgres_data:
  mcp_data:
